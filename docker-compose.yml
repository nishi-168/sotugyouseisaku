services:
  app:
    build: .
    container_name: sotugyou-app
    volumes:
      - .:/app                      # ソースコードをマウント
      - node_modules:/app/node_modules  # node_modules は名前付きボリュームで高速化
    working_dir: /app
    ports:
      - "3005:3005"
    command: sleep infinity         # Dev Container 用に待機させる

volumes:
  node_modules: